<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual-Loop Career Agent | Enterprise Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(20, 25, 37, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 3rem 1.5rem;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        h1 {
            font-weight: 700; font-size: 2.5rem; margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        .subtitle { color: var(--text-muted); margin-bottom: 3rem; font-size: 1.1rem; }

        .glass-panel {
            background: var(--panel-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 2rem; margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-bottom: 2.5rem; }

        .stat-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 1.5rem; text-align: center; position: relative; overflow: hidden;
        }
        
        .stat-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(to right, transparent, var(--accent), transparent); opacity: 0.5;
        }

        .stat-value { font-size: 2.5rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
        .stat-label { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }

        h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: #e2e8f0; }
        
        .btn-group { display: flex; gap: 1rem; flex-wrap: wrap; }

        .btn {
            background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center; gap: 0.5rem; font-size: 0.95rem;
        }
        .btn:hover:not(:disabled) { background: rgba(59, 130, 246, 0.2); transform: translateY(-1px); }
        .btn:disabled { background: rgba(255, 255, 255, 0.05); color: #64748b; cursor: not-allowed; }

        .btn-apply {
            background: #10b981; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; 
            text-decoration: none; font-weight: 600; font-size: 0.9rem;
            display: inline-block; transition: background 0.2s; border: none;
        }
        .btn-apply:hover { background: #059669; }

        .terminal-container {
            background: #0f172a; border: 1px solid #1e293b; border-radius: 8px;
            padding: 1rem; height: 200px; overflow-y: auto; font-family: monospace;
            font-size: 0.9rem; color: #38bdf8; line-height: 1.5; margin-bottom: 1rem;
        }

        /* Job Cards Styling */
        .jobs-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-top: 1.5rem; }
        .job-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 1.5rem; display: flex; justify-content: space-between;
            align-items: center; transition: background 0.2s;
        }
        .job-card:hover { background: rgba(255, 255, 255, 0.06); }
        .job-info h3 { margin-bottom: 0.25rem; font-size: 1.1rem; color: #fff; }
        .job-company { color: #60a5fa; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .job-desc { color: #94a3b8; font-size: 0.85rem; line-height: 1.4; max-width: 600px; }
        .badge {
            display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; 
            font-size: 0.75rem; font-weight: 700; margin-right: 0.5rem; margin-bottom: 0.5rem;
        }
        .badge-sponsored { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge-tier { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dual-Loop Agent Control Center</h1>
        <p class="subtitle">Enterprise-grade autonomous career progression framework.</p>
        
        <div class="stats-grid" id="stats-container">
            <div class="stat-card">
                <div class="stat-value" id="stat-scraped">0</div>
                <div class="stat-label">Web Jobs Scraped</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-qualified">0</div>
                <div class="stat-label">Sponsorship Verified</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-tailored">0</div>
                <div class="stat-label">Resumes Tailored</div>
            </div>
        </div>

        <div class="glass-panel">
            <h2>Outbound Loop: Application Engine</h2>
            <div class="btn-group">
                <button class="btn" id="btn-agent1" onclick="runAgent('agent1')">Scan Web for Sponsored Roles</button>
                <button class="btn" id="btn-agent2" onclick="runAgent('agent2')">Generate Tailored Resumes</button>
            </div>
            <div id="jobs-container" class="jobs-grid"></div>
        </div>

        <div class="glass-panel">
            <h2>Inbound Loop: Interview Prep</h2>
            <div class="btn-group">
                <button class="btn" id="btn-agent5" onclick="runAgent('agent5')">Generate Daily Micro-Challenge</button>
            </div>
        </div>

        <div class="glass-panel">
            <h2>Live Telemetry</h2>
            <div class="terminal-container" id="terminal">
                <div style="color: #64748b">[SYSTEM] Agent framework initialized.</div>
            </div>
        </div>
    </div>

    <script>
        function log(msg, type="INFO") {
            const term = document.getElementById('terminal');
            const time = new Date().toLocaleTimeString('en-GB');
            const color = type === "OUTPUT" ? "#a78bfa" : "#38bdf8";
            term.innerHTML += `<div style="color: ${color}"><span style="color: #64748b">[${time}]</span> ${msg.replace(/\\n/g, '<br>')}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        async function fetchState() {
            try {
                const res = await fetch('/api/state');
                const state = await res.json();
                document.getElementById('stat-scraped').innerText = state.metrics.jobs_scraped;
                document.getElementById('stat-qualified').innerText = state.metrics.jobs_qualified;
                document.getElementById('stat-tailored').innerText = state.metrics.applications_tailored;
            } catch (e) { }
        }

        async function fetchJobs() {
            try {
                const res = await fetch('/api/qualified_jobs');
                const jobs = await res.json();
                const container = document.getElementById('jobs-container');
                container.innerHTML = '';
                
                if(jobs.length > 0) {
                    jobs.forEach(job => {
                        let sponsoredClass = job.category.includes('SPONSORED') ? 'badge-sponsored' : 'badge-sponsored';
                        
                        container.innerHTML += `
                        <div class="job-card">
                            <div class="job-info">
                                <h3>${job.title}</h3>
                                <div class="job-company">${job.company}</div>
                                <div>
                                    <span class="badge badge-tier">${job.priority_label}</span>
                                    <span class="badge ${sponsoredClass}">${job.category.replace('[','').replace(']','')}</span>
                                </div>
                                <div class="job-desc">${job.description}</div>
                            </div>
                            <div>
                                <a href="${job.url}" target="_blank" class="btn-apply">Apply Now &rarr;</a>
                            </div>
                        </div>`;
                    });
                }
            } catch (e) { }
        }

        async function runAgent(agentId) {
            const btn = document.getElementById(`btn-${agentId}`);
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = `Executing...`;
            log(`Triggered execution for ${agentId}...`, "INFO");
            
            try {
                const res = await fetch(`/api/run/${agentId}`, { method: 'POST' });
                const data = await res.json();
                if(data.log) {
                    const lines = data.log.split('\n');
                    for(let line of lines) {
                        if(line.trim() !== '') log(line, "OUTPUT");
                    }
                }
                await fetchState();
                if(agentId === 'agent1') await fetchJobs();
            } catch (e) {
                log(`Failed to run ${agentId}. Network error.`, "ERROR");
            } finally {
                btn.disabled = false; btn.innerHTML = originalText;
            }
        }

        fetchState();
        fetchJobs(); // Load existing jobs on startup
    </script>
</body>
</html>
